openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Zubair Traders bakery management API
servers:
  - url: /api
tags:
  - name: health
  - name: dashboard
  - name: buyers
  - name: suppliers
  - name: products
  - name: sales
  - name: purchases
  - name: expenses
  - name: loans
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /buyers:
    get:
      operationId: getBuyers
      tags: [buyers]
      summary: List buyers
      responses:
        "200":
          description: Buyers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Buyer" }
    post:
      operationId: createBuyer
      tags: [buyers]
      summary: Create buyer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
  /buyers/{id}:
    patch:
      operationId: updateBuyer
      tags: [buyers]
      summary: Update buyer
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuyerUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Buyer" }
  /suppliers:
    get:
      operationId: getSuppliers
      tags: [suppliers]
      summary: List suppliers
      responses:
        "200":
          description: Suppliers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Supplier" }
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create supplier
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupplierInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Supplier" }
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List products
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
    post:
      operationId: createProduct
      tags: [products]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /sales:
    get:
      operationId: getSales
      tags: [sales]
      summary: List recent sales
      responses:
        "200":
          description: Sales
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Sale" }
    post:
      operationId: createSale
      tags: [sales]
      summary: Create sale invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
  /sales/{id}:
    get:
      operationId: getSale
      tags: [sales]
      summary: Get an invoice with its products
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Invoice details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
  /expenses:
    get:
      operationId: getExpenses
      tags: [expenses]
      summary: List expenses
      responses:
        "200":
          description: Expenses
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Expense" }
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create expense
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Expense" }
  /loans:
    get:
      operationId: getLoans
      tags: [loans]
      summary: List loans
      responses:
        "200":
          description: Loans
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Loan" }
    post:
      operationId: createLoan
      tags: [loans]
      summary: Create loan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoanInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Dashboard:
      type: object
      required: [dailySales, todaysProfit, buyerDebt, supplierOwed, cashInDrawer, lowStock, salesTrend, recentActivity]
      properties:
        dailySales: { type: number }
        todaysProfit: { type: number }
        buyerDebt: { type: number }
        supplierOwed: { type: number }
        cashInDrawer: { type: number }
        lowStock:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        salesTrend:
          type: array
          items: { $ref: "#/components/schemas/TrendPoint" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
    TrendPoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: number }
    Activity:
      type: object
      required: [id, title, detail, time, type]
      properties:
        id: { type: number }
        title: { type: string }
        detail: { type: string }
        time: { type: string }
        type: { type: string }
    Buyer:
      type: object
      required: [id, name, phone, cnic, address, creditLimit, currentBalance, createdAt]
      properties:
        id: { type: number }
        name: { type: string }
        phone: { type: string }
        cnic: { type: string }
        address: { type: string }
        creditLimit: { type: number }
        currentBalance: { type: number }
        createdAt: { type: string }
    BuyerInput:
      type: object
      required: [name, phone, cnic, address, creditLimit]
      properties:
        name: { type: string }
        phone: { type: string }
        cnic: { type: string }
        address: { type: string }
        creditLimit: { type: number }
    BuyerUpdate:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        cnic: { type: string }
        address: { type: string }
        creditLimit: { type: number }
    Supplier:
      type: object
      required: [id, name, phone, companyName, address, currentBalance, createdAt]
      properties:
        id: { type: number }
        name: { type: string }
        phone: { type: string }
        companyName: { type: string }
        address: { type: string }
        currentBalance: { type: number }
        createdAt: { type: string }
    SupplierInput:
      type: object
      required: [name, phone, companyName, address]
      properties:
        name: { type: string }
        phone: { type: string }
        companyName: { type: string }
        address: { type: string }
    Product:
      type: object
      required: [id, name, unit, purchaseCost, sellingPrice, stockQuantity, minStockAlert]
      properties:
        id: { type: number }
        name: { type: string }
        unit: { type: string }
        purchaseCost: { type: number }
        sellingPrice: { type: number }
        stockQuantity: { type: number }
        minStockAlert: { type: number }
    ProductInput:
      type: object
      required: [name, unit, purchaseCost, sellingPrice, stockQuantity, minStockAlert]
      properties:
        name: { type: string }
        unit: { type: string }
        purchaseCost: { type: number }
        sellingPrice: { type: number }
        stockQuantity: { type: number }
        minStockAlert: { type: number }
    Sale:
      type: object
      required: [id, invoiceNumber, buyerId, buyerName, totalAmount, paidAmount, dueAmount, paymentStatus, transactionTime, items]
      properties:
        id: { type: number }
        invoiceNumber: { type: string }
        buyerId: { type: number }
        buyerName: { type: string }
        totalAmount: { type: number }
        paidAmount: { type: number }
        dueAmount: { type: number }
        paymentStatus: { type: string }
        transactionTime: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/SaleItem" }
    SaleItem:
      type: object
      required: [id, productId, productName, unit, quantity, unitPrice, subtotal]
      properties:
        id: { type: number }
        productId: { type: number }
        productName: { type: string }
        unit: { type: string }
        quantity: { type: number }
        unitPrice: { type: number }
        subtotal: { type: number }
    SaleInput:
      type: object
      required: [buyerId, items, paidAmount, paymentStatus, transactionTime]
      properties:
        buyerId: { type: number }
        items:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SaleItemInput" }
        paidAmount: { type: number }
        paymentStatus: { type: string }
        notes: { type: string }
        transactionTime: { type: string }
    SaleItemInput:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId: { type: number }
        quantity: { type: number }
        unitPrice: { type: number }
    Expense:
      type: object
      required: [id, category, amount, description, expenseDate]
      properties:
        id: { type: number }
        category: { type: string }
        amount: { type: number }
        description: { type: string }
        expenseDate: { type: string }
    ExpenseInput:
      type: object
      required: [category, amount, description]
      properties:
        category: { type: string }
        amount: { type: number }
        description: { type: string }
        expenseDate: { type: string }
    Loan:
      type: object
      required: [id, personName, phone, loanType, amount, balanceRemaining, description, dateGiven]
      properties:
        id: { type: number }
        personName: { type: string }
        phone: { type: string }
        loanType: { type: string }
        amount: { type: number }
        balanceRemaining: { type: number }
        description: { type: string }
        dateGiven: { type: string }
    LoanInput:
      type: object
      required: [personName, phone, loanType, amount, description]
      properties:
        personName: { type: string }
        phone: { type: string }
        loanType: { type: string }
        amount: { type: number }
        description: { type: string }